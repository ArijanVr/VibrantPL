<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<title>Vibrant+ App-Icon A, Porzellan-Puls, vollflächig</title>
<!-- Icon Composer: vollflächig, ohne Aussenmaske und ohne Text. macOS setzt Squircle, Glas und Schatten. -->
<defs>
<linearGradient id="porc" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FDFCFA"/>
<stop offset="1" stop-color="#ECEAE4"/>
</linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
<stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="760">
<stop offset="0" stop-color="#3A3A3D"/>
<stop offset="1" stop-color="#141415"/>
</linearGradient>
<radialGradient id="dotg" cx="0.32" cy="0.28" r="0.78">
<stop offset="0" stop-color="#F48AB4"/>
<stop offset="1" stop-color="#C2306A"/>
</radialGradient>
<filter id="lineShadow" x="-30%" y="-30%" width="160%" height="180%">
<feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
<feOffset in="blur" dy="16" result="off"/>
<feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="1024" height="1024" fill="url(#porc)"/>
<rect width="1024" height="460" fill="url(#gloss)"/>
<g filter="url(#lineShadow)">
<polyline points="232,540 400,540 444,318 548,742 616,430 664,540 736,540" fill="none" stroke="url(#ink)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<circle cx="806" cy="556" r="44" fill="#000000" opacity="0.16"/>
<circle cx="806" cy="540" r="44" fill="url(#dotg)"/>
<ellipse cx="792" cy="522" rx="16" ry="10" fill="#FFFFFF" opacity="0.55"/>
</svg>
